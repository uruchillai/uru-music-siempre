<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌌 UruchillAI Portal</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#020617;
color:white;
}

header{
background:#0f172a;
padding:15px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:10px;
}

.hero{
padding:80px 20px;
text-align:center;
background:linear-gradient(135deg,#1d4ed8,#020617);
}

.btn{
display:inline-block;
padding:12px 20px;
background:#2563eb;
color:white;
text-decoration:none;
border-radius:10px;
margin:5px;
}

.card{
max-width:900px;
margin:auto;
padding:20px;
}

audio{
width:100%;
margin-top:20px;
}

button{
padding:10px 15px;
margin:5px;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<header>

<nav>

<a href="#inicio">Inicio</a>
<a href="#musica">Música</a>
<a href="#space">Space IA</a>

</nav>

</header>

<section id="inicio" class="hero">

<h1>🚀 UruchillAI Portal</h1>

<p>
Reproductor musical conectado a GitHub
</p>

<a
class="btn"
href="https://github.com/uruchillai/uru-music-siempre"
target="_blank">
GitHub
</a>

</section>

<section id="musica">

<div class="card">

<h2 id="songTitle">
Cargando...
</h2>

<audio
id="audioPlayer"
controls>
</audio>

<div>

<button id="prevBtn">⏮</button>
<button id="nextBtn">⏭</button>
<button id="randomBtn">🔀</button>

</div>

<p id="songCounter">
0 / 0
</p>

</div>

</section>

<section id="space" class="card">

<h2>🤖 Space IA</h2>

<iframe
src="https://ernimu-uruchillai-gradio.hf.space"
width="100%"
height="700">
</iframe>

</section>

<script>

const usuarioGit="uruchillai";
const repoGit="uru-music-siempre";

let canciones=[];
let actual=0;

const audio=document.getElementById("audioPlayer");

function cargarCancion(i){

actual=i;

audio.src=canciones[i].url;

document.getElementById("songTitle").innerText=
canciones[i].nombre;

document.getElementById("songCounter").innerText=
(actual+1)+" / "+canciones.length;

audio.play();

}

fetch(
`https://api.github.com/repos/${usuarioGit}/${repoGit}/contents/musica`
)

.then(r=>r.json())

.then(data=>{

canciones=data
.filter(f=>f.name.endsWith(".mp3"))
.map(f=>({
nombre:f.name,
url:f.download_url
}));

if(canciones.length){

cargarCancion(0);

}

});

document.getElementById("nextBtn").onclick=()=>{

if(!canciones.length)return;

cargarCancion(
(actual+1)%canciones.length
);

};

document.getElementById("prevBtn").onclick=()=>{

if(!canciones.length)return;

cargarCancion(
(actual-1+canciones.length)%canciones.length
);

};

document.getElementById("randomBtn").onclick=()=>{

if(!canciones.length)return;

cargarCancion(
Math.floor(
Math.random()*canciones.length
)
);

};

audio.addEventListener("ended",()=>{

if(!canciones.length)return;

cargarCancion(
(actual+1)%canciones.length
);

});

</script>

</body>
</html>
