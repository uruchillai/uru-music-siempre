<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌌 UruchillAI Portal</title>

<style>

*{
margin:0;
padding:0;
box-sizing:*order-box;
}

html{
scroll-behavio*:smooth;
}

body{
font-family:Sego* UI, Arial, sans-serif;
background*linear-gradient(180deg,#020617,#0f*72a,#1e3a8a);
color:white;
min-height:100vh;
}

header{
position:sticky;
top:0;
z-index:1000;
background:rgba(0,0,0,.55);
backdrop-filter:blur(10px);
padding:15px;
}

nav{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

nav a{
color:white;
text-decoration:none;
font-weight:bold;
transition:.3s;
}

nav a:hover{
color:#38bdf8;
}

.hero{
padding:80px 20px;
text-align:center;
}

.hero h1{
font-size:3rem;
margin-bottom:15px;
color:#38bdf8;
}

.hero p{
font-size:1.2rem;
opacity:.9;
}

.btn{
display:inline-block;
margin:10px;
padding:12px 22px;
border-radius:12px;
background:#2563eb;
color:white;
text-decoration:none;
font-weight:bold;
transition:.3s;
}

.btn:hover{
background:#3b82f6;
transform:translateY(-3px);
}

section{
max-width:1100px;
margin:auto;
padding:30px;
}

.card{
background:rgba(255,255,255,.08);
padding:25px;
border-radius:20px;
backdrop-filter:blur(10px);
box-shadow:0 0 20px rgba(0,0,0,.2);
margin-bottom:25px;
}

h2{
margin-bottom:15px;
color:#38bdf8;
}

audio,
video{
width:100%;
margin-top:15px;
border-radius:10px;
}

button{
padding:10px 15px;
border:none;
border-radius:10px;
cursor:pointer;
background:#3b82f6;
color:white;
font-size:16px;
margin:5px;
}

button:hover{
background:#60a5fa;
}

#songTitle{
text-align:center;
margin:15px 0;
color:#38bdf8;
}

#songCounter{
text-align:center;
margin-top:10px;
}

.controls{
text-align:center;
}

iframe{
width:100%;
height:700px;
border:none;
border-radius:15px;
background:white;
}

footer{
margin-top:50px;
text-align:center;
padding:25px;
background:#020617;
}

.status{
text-align:center;
padding:10px;
color:#93c5fd;
}

</style>

</head>

<body>

<header>

<nav>
#inicioInicio</a>
#musicaMúsica</a>
#videosVideos</a>
#spaceSpace IA</a>
</nav>

</header>

<section id="inicio" class="hero">

<h1>🚀 UruchillAI Portal</h1>

<p>Streaming • Música • Video • Inteligencia Artificial</p>

<br>

<a
class="btn"
href="https://github.com/uruchillai/uru-music-siempre"
target="_blank">
📂 GitHub
</a>

<a
class="btn"
href="https://ernimu-uruchillai-gradio.hf.space"
target="_blank">
🤖 Abrir IA
</a>

</section>

<section id="musica">

<div class="card">

<h2>🎵 Reproductor Musical</h2>

<h3 id="songTitle">
Cargando canciones...
</h3>

<audio
id="audioPlayer"
controls>
</audio>

<div class="controls">

<button id="prevBtn">⏮</button>
<button id="nextBtn">⏭</button>
<button id="randomBtn">🔀</button>

</div>

<p id="songCounter">
0 / 0
</p>

</div>

</section>

<section id="videos">

<div class="card">

<h2>🎬 Reproductor de Videos</h2>

<video
id="videoPlayer"
controls>
</video>

<div id="videoStatus" class="status">
Cargando videos...
</div>

</div
