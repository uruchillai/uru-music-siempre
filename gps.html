<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreador GPS Antirrobo - URU</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #0b0f19; color: #00ffcc; }
        h1 { color: #ffffff; font-size: 22px; }
        #estado { font-size: 16px; margin: 20px; padding: 15px; background: #1f2937; border-radius: 8px; display: inline-block; border: 1px solid #374151; text-align: left; }
    </style>
</head>
<body>
    <h1>🛰️ Rastreo Satelital en Línea</h1>
    <div id="estado">Conectando con los satélites GPS...</div>
    <p style="color: #9ca3af; font-size: 14px;">Mantén esta pestaña abierta en el celular.</p>

    <script>
        // Verificamos si el navegador del celular soporta geolocalización por satélite
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(enviarCoordenadas, mostrarError, {
                enableHighAccuracy: true, // Fuerza el uso del chip GPS real (satélites)
                maximumAge: 0,            // No guarda datos viejos, exige ubicación actual
                timeout: 10000
            });
        } else {
            document.getElementById("estado").innerText = "Tu navegador no soporta GPS.";
        }

        function enviarCoordenadas(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const velocidad = position.coords.speed || 0;

            // Generamos el enlace directo a Google Maps con la posición exacta
            const linkGoogleMaps = `https://www.google.com/maps?q=${lat},${lon}`;

            document.getElementById("estado").innerHTML = `
                🟢 <b>Transmitiendo en vivo</b><br><br>
                📍 Lat: ${lat.toFixed(6)}<br>
                📍 Lon: ${lon.toFixed(6)}<br>
                🚀 Velocidad: ${(velocidad * 3.6).toFixed(1)} km/h<br><br>
                <a href="${linkGoogleMaps}" target="_blank" style="
                    display: block;
                    background: #00ffcc;
                    color: #0b0d17;
                    padding: 10px 15px;
                    border-radius: 8px;
                    text-decoration: none;
                    font-weight: bold;
                    text-align: center;
                    box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
                ">🗺️ Abrir en Google Maps</a>
            `;
        }

        function mostrarError(error) {
            document.getElementById("estado").innerText = "⚠️ Activa el GPS y los permisos de ubicación en tu celular.";
        }
    </script>
</body>
</html>
