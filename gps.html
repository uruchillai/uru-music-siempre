<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico GPS - URU</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #0b0f19; color: #00ffcc; padding: 20px; }
        #consola { font-family: monospace; font-size: 14px; margin: 20px auto; padding: 15px; background: #1f2937; border-radius: 8px; border: 1px solid #374151; max-width: 400px; text-align: left; word-break: break-all; }
        button { background: #00ffcc; color: #0b0f19; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🛰️ Diagnóstico de GPS</h1>
    <p>Presiona el botón para forzar la lectura del satélite:</p>
    <button onclick="probarGPS()">Forzar Lectura GPS</button>
    <div id="consola">Esperando acción...</div>

    <script>
        function log(texto) {
            document.getElementById("consola").innerHTML += "<br>> " + texto;
        }

        function probarGPS() {
            document.getElementById("consola").innerHTML = "Iniciando solicitud de GPS...";
            
            if (!navigator.geolocation) {
                log("ERROR: Tu navegador no soporta geolocalización.");
                return;
            }

            log("Navegador compatible. Solicitando permisos...");

            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    log("¡ÉXITO!");
                    log("Lat: " + pos.coords.latitude);
                    log("Lon: " + pos.coords.longitude);
                    log("Precisión: " + pos.coords.accuracy + " metros");
                    
                    let mapsUrl = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    log(`<br><a href="${mapsUrl}" target="_blank" style="color: #fff; background: #0077ff; padding: 8px; display:inline-block; margin-top:10px; border-radius:5px; text-decoration:none;">Abrir en Google Maps</a>`);
                },
                function(err) {
                    log("ERROR GPS (Código " + err.code + "): " + err.message);
                    if(err.code === 1) log("-> Permiso denegado por el usuario o el navegador.");
                    if(err.code === 2) log("-> Posición no disponible. ¿Tienes el GPS del cel encendido?");
                    if(err.code === 3) log("-> Tiempo de espera agotado.");
                },
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        }
    </script>
</body>
</html>
